[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-diff"
version = "0.1.0"
description = "Check a focused subset of OpenAPI 3.1 compatibility rules."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
contract-diff = "contract_diff.cli:main"

[tool.setuptools.packages.find]
include = ["contract_diff*"]
